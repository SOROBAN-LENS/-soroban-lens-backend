[workspace]
resolver = "3"
members = [
    "api",
    "crates/models",
    "crates/stellar-client",
    "crates/error-analyzer",
    "crates/diagnostic-engine",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/soroban-lens/soroban-lens-backend"
authors = ["SorobanLens contributors"]

[workspace.dependencies]
# Internal crates
soroban-lens-models = { path = "crates/models" }
soroban-lens-stellar-client = { path = "crates/stellar-client" }
soroban-lens-error-analyzer = { path = "crates/error-analyzer" }
soroban-lens-diagnostic-engine = { path = "crates/diagnostic-engine" }

# Stellar
stellar-xdr = { version = "30.0.0", default-features = false, features = ["std", "base64"] }

# Web / async
axum = "0.8.9"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "timeout", "request-id", "set-header", "util"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
async-trait = "0.1.92"

# Serialization / utilities
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.29", features = ["v4", "serde"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
url = "2.5.8"
dotenvy = "0.15.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }

# Testing
wiremock = "0.6.5"
http-body-util = "0.1.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
