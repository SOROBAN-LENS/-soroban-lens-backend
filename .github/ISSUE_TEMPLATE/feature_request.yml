name: Feature request
description: Suggest a new capability or diagnostic rule.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: references
    attributes:
      label: References
      description: Official Stellar docs, example transactions, related issues.
