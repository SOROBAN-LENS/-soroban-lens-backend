name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: soroban_lens
          POSTGRES_PASSWORD: soroban_lens
          POSTGRES_DB: soroban_lens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soroban_lens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Enables the PostgreSQL store tests in api/tests/store.rs.
      TEST_DATABASE_URL: postgres://soroban_lens:soroban_lens@localhost:5432/soroban_lens
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
